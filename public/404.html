<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>asterisk*</title>
    <script>
      // Single Page Apps for GitHub Pages & Static Hosts
      var l = window.location;
      var cleanPath = l.pathname.replace(/^\/+|\/+$/g, "");
      var search = l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "";
      var target =
        l.protocol +
        "//" +
        l.hostname +
        (l.port ? ":" + l.port : "") +
        "/?" +
        cleanPath +
        search +
        l.hash;
      l.replace(target);
    </script>
  </head>
  <body></body>
</html>
